
name: Build Ölçüm Raporu APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          test -f OLCUM_RAPORU_SOURCE.zip || {
            echo "Repository root must contain OLCUM_RAPORU_SOURCE.zip"
            exit 1
          }

      - name: Extract source archive
        run: |
          mkdir app-source
          unzip -q OLCUM_RAPORU_SOURCE.zip -d app-source
          test -f app-source/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: app-source
        run: npm install

      - name: Build web app
        working-directory: app-source
        run: npm run build

      - name: Generate Android project
        working-directory: app-source
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: app-source
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app-source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: olcum-raporu-debug-apk
          path: app-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
